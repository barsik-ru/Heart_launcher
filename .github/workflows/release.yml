name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # Запускаем сборку параллельно на Windows и Linux
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run checks & tests
        run: |
          npm run typecheck
          npm test

      # Этот шаг сработает только на сервере Windows
      - name: Build and Publish (Windows)
        if: matrix.os == 'windows-latest'
        env:
          VITE_USE_MOCKS: 'false'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win -- --publish always

      # Этот шаг сработает только на сервере Linux
      - name: Build and Publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          VITE_USE_MOCKS: 'false'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:linux -- --publish always